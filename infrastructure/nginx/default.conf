# =============================================================================
# Nginx - Configuración de producción para Daryza Core
# Sirve /var/www/public y delega PHP a app:9000 (PHP-FPM).
# =============================================================================

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;
    charset utf-8;

    server_tokens off;

    client_max_body_size 100M;
    client_body_timeout 300s;

    # Headers grandes (cookies, Authorization, etc.)
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    keepalive_timeout 65s;

    # -------------------------------------------------------------------------
    # Seguridad
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Assets compilados por Vite (hash en el nombre -> cache inmutable)
    # -------------------------------------------------------------------------
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Otros archivos estáticos
    # -------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?|eot|ttf|otf|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Archivos ocultos (.env, .git, etc.) excepto .well-known
    # -------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # PHP-FPM
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";

        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 128k;

        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
    }

    # -------------------------------------------------------------------------
    # Front controller
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
