services:
  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: daryza_app
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # - .:/var/www
      - ./infrastructure/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
        # - './infrastructure/php/www.conf:/usr/local/etc/php-fpm.d/www.conf'
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - daryza

  queue:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: daryza_queue
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - .:/var/www
      - ./infrastructure/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - daryza
    command: php artisan queue:work --queue=default --tries=1 --timeout=3600 --sleep=1 --backoff=5

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: daryza_scheduler
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - .:/var/www
      - ./infrastructure/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - daryza
    command: php artisan schedule:work

  nginx:
    image: nginx:alpine
    container_name: daryza_nginx
    restart: unless-stopped
    ports:
      - '8082:80'
    volumes:
      - .:/var/www
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - daryza

  postgresql:
    image: postgres:15
    container_name: daryza_postgresql
    restart: unless-stopped
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - daryza
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      retries: 5
      timeout: 5s

volumes:
  postgres:

networks:
  daryza:
    driver: bridge
