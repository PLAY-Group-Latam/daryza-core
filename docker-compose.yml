services:
  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    image: daryza_app:latest # <--- Asigna la etiqueta para que queue y scheduler la reutilicen
    container_name: daryza_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: 5432
    volumes:
      - daryza_storage:/var/www/storage/app/public
      - ./infrastructure/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - daryza

  queue:
    image: daryza_app:latest
    pull_policy: build # <--- Le indica que espere a la compilación local
    container_name: daryza_queue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: 5432
    volumes:
      - daryza_storage:/var/www/storage/app/public
      - ./infrastructure/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      app:
        condition: service_started
      postgresql:
        condition: service_healthy
    networks:
      - daryza
    command: php artisan queue:work --queue=default --tries=1 --timeout=3600 --sleep=1 --backoff=5

  scheduler:
    image: daryza_app:latest
    pull_policy: build # <--- Le indica que espere a la compilación local
    container_name: daryza_scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: 5432
    volumes:
      - daryza_storage:/var/www/storage/app/public
      - ./infrastructure/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      app:
        condition: service_started
      postgresql:
        condition: service_healthy
    networks:
      - daryza
    command: php artisan schedule:work

  nginx:
    image: nginx:alpine
    container_name: daryza_nginx
    restart: unless-stopped
    ports:
      - '127.0.0.1:8082:80'
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    volumes_from:
      - app:ro
    depends_on:
      - app
    networks:
      - daryza

  postgresql:
    image: postgres:15
    container_name: daryza_postgresql
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - daryza
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      retries: 5
      timeout: 5s

volumes:
  postgres_data:
  daryza_storage:

networks:
  daryza:
    driver: bridge
